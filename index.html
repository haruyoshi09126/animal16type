<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>どうぶつ16タイプ診断 🐾</title>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <h1>どうぶつ16タイプ診断 🐾</h1>
    <p class="tagline">こどもの強みがわかる診断！ママ・パパ向けメッセージあり</p>
  </header>
>

  <main class="container">
    <section id="screen-start" class="screen active">
      <h2>10のしつもんに「A / B」でこたえてね</h2>
      <button class="btn primary big" id="btn-start">診断をはじめる</button>
    </section>

    <section id="screen-quiz" class="screen">
      <div class="progress"><div id="progress-bar" class="bar"></div></div>
      <h2 id="q-title"></h2>
      <p id="q-text" class="qtext"></p>
      <div class="choices">
        <button class="btn choice big" id="btnA">A</button>
        <button class="btn choice big" id="btnB">B</button>
      </div>
      <div class="nav">
        <button class="btn ghost" id="btn-back">← もどる</button>
      </div>
    </section>

    <section id="screen-result" class="screen">
  <h2>結果</h2>
  <div class="result-card">
    <div class="result-hero">
      <div class="animal-badge" id="animal-emoji">🦁</div>
      <div>
        <div class="type-code" id="type-code">ENTJ</div>
        <div class="animal-name" id="animal-name">ライオン</div>
      </div>
    </div>

    <details open>
      <summary>こども向けメッセージ</summary>
      <p id="kid-msg"></p>
    </details>

    <details open>
      <summary>おとな向け解説</summary>
      <p id="adult-desc"></p>
    </details>

    <details open>
      <summary>探究テーマのヒント</summary>
      <ul id="themes" class="chips"></ul>
    </details>

    <details open>
      <summary>適職・活動アイデア</summary>
      <ul id="careers" class="chips"></ul>
    </details>
  </div>

  <div class="cta-row">
    <button class="btn primary" id="btn-share">結果をシェア</button>
    <button class="btn ghost" id="btn-retry">もう一度する</button>
  </div>
</section>


  <!-- 重要：JSは一番最後に読み込む -->
  <script src="app.js"></script>
</body>
</html>
